@if (mensajeError()) {
  <div class="error-container">
    <mat-icon class="error-icon">error_outline</mat-icon>
    <p class="error-message">{{ mensajeError() }}</p>
  </div>
} @else {
  @if (formaAnalisis() === 'masiva') {
    <app-resumen-estadistico [allItems]="allItems()" />
  }

  <div class="tabla-resultados">
    <table mat-table [dataSource]="currentPageItems()">
      <ng-container matColumnDef="comentario">
        <th mat-header-cell *matHeaderCellDef>Comentario</th>

        <td mat-cell *matCellDef="let element">
          <p class="comentario">{{ element.text }}</p>
        </td>
      </ng-container>

      <ng-container matColumnDef="sentimiento">
        <th mat-header-cell *matHeaderCellDef>Sentimiento</th>

        <td mat-cell *matCellDef="let element">
          <div></div>

          <app-etiqueta-sentimiento [sentimiento]="element.prevision" />
        </td>
      </ng-container>

      <ng-container matColumnDef="probabilidad">
        <th mat-header-cell *matHeaderCellDef>Probabilidad</th>

        <td mat-cell *matCellDef="let element">
          {{ element.probabilidad | number: '1.1-2' }}
        </td>
      </ng-container>

      @if (formaAnalisis() === 'masiva') {
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">
            &nbsp;
          </th>

          <td mat-cell *matCellDef="let element">
            <button
              type="button"
              matIconButton
              aria-label="Eliminar registro"
              (click)="eliminarRegistro(element.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumnsTable()"></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumnsTable()"
        class="comentario"
        [class.comentario-full]="isExpanded(row)"
        (click)="toggle(row)"></tr>
    </table>

    @if (formaAnalisis() === 'masiva') {
      <mat-paginator
        class="paginator"
        [length]="allItems().length"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="[5, 10, 15, 20, 25]"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    }
  </div>
}
