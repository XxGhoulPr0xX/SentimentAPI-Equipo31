<footer>
  <span>GRUPO 31</span>
  <ul>
    @for (integrante of integrantes; track $index) {
      <li>
        @if (integrante.linkedin) {
          <a
            [href]="integrante.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            >{{ integrante.fullName }}</a
          >
        } @else {
          <span>{{ integrante.fullName }}</span>
        }
      </li>
    }
  </ul>
</footer>
