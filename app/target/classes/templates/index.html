<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Análisis de Sentimiento</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>

    <h1>Análisis de Sentimiento con IA</h1>
    
    <form th:action="@{/sentiment}" method="post" id="sentimentForm">
        <textarea name="texto" placeholder="Escribe tu reseña o comentario aquí..."></textarea>
        <br>
        <button type="submit">Analizar Sentimiento</button>
    </form>

    <hr>

    <div class="resultados">
        <p>Revision: <span id="revisionResultado">Esperando Revision: Aqui se actualizara cuando se obtenga los resultados de ia</span></p>
        <p>Probabilidad: <span id="probabilidadResultado">0.0%</span></p>
    </div>

    <script th:src="@{/js/index.js}"></script>
</body>
</html>
