<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comentarios</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a th:href="@{/index}" class="nav-link">Análisis</a>
        <a th:href="@{/acerca}" class="nav-link">Acerca de</a>
      </div>
    </nav>
    <div class="container">
      <h1 class="title">Análisis de Sentimiento con IA</h1>

      <form class="comment-form">
        <div class="quote-icon quote-left">"</div>
        <div class="user-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <textarea
          id="commentInput"
          name="text"
          class="comment-textarea"
          placeholder="Escribe tu comentario aquí..."
          rows="4"
          required
        ></textarea>
        <div class="quote-icon quote-right">"</div>
        <!-- Puse type="button" porque en Brave se enviaba el form como GET 
                 y el texto aparecía en la URL. Con esto lo manejo todo desde JS -->
        <button type="button" class="submit-button" id="submitButton">
          Analizar Sentimiento
        </button>
      </form>

      <div class="status-container">
        <div class="status-badge" id="statusBadge">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="clock-icon"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="statusText">Esperando...</span>
        </div>
      </div>
    </div>

    <script th:src="@{/js/index.js}"></script>
  </body>
</html>
