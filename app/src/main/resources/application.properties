spring.application.name=app
server.port=5000

# Modelos ONNX
#onnx.model.path.esp=models/modelo_sentimientoESP.onnx
#onnx.model.path.en=models/modelo_sentimientoENG.onnx

# Habilitar la consola H2
# Configurar la URL de conexión fija para que sea fácil entrar
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
# Formatear el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true
# Mostrar los valores de los parámetros (metadatos del insert)
logging.level.org.hibernate.orm.jdbc.bind=trace